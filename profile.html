<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="髹饰录 · 数字匠人个人档案">
  <title>髹饰录 · 个人档案</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="fonts/ZiYueYingYinSong-2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="profile-page">
  <div class="paper-texture"></div>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回漆器复原工坊">
      <span class="brand-seal">髹</span>
      <span><strong>髹饰录</strong><small>漆器数字复原工坊</small></span>
    </a>
    <nav class="top-actions" aria-label="辅助导航">
      <a class="text-button" href="index.html">髹饰工坊</a>
      <a class="text-button" href="square.html">广场</a>
      <a class="text-button" href="knowledge.html">知识图谱</a>
      <a class="text-button" href="about.html">关于网站</a>
      <a class="text-button auth-state-pending" id="auth-open" href="profile.html" aria-current="page">用户中心</a>
      <a class="text-button" id="settings-open" href="#settings-panel">设置</a>
    </nav>
  </header>

  <main class="profile-workspace">
    <section class="profile-hero">
      <div>
        <span class="eyebrow">PERSONAL ARCHIVE · 03 / 匠人</span>
        <h1>个人档案</h1>
        <p>每一次髹饰，都是与一件古老器物的相逢。</p>
      </div>
      <div class="profile-seal"><span>髹</span><small>数字匠人</small></div>
    </section>
    <section class="profile-summary panel">
      <div class="profile-title"><span class="eyebrow">当前身份</span>
        <h2 id="artisan-title">初入髹饰</h2>
        <p id="artisan-caption">正在认识漆、色与器物之间的关系</p>
      </div>
      <div class="profile-stat"><strong id="unlocked-count">0</strong><span>已解锁器物</span></div>
      <div class="profile-stat"><strong id="recipe-count">0</strong><span>已完成配方</span></div>
      <div class="profile-stat progress-stat"><strong id="progress-value">0%</strong><span>探索进度</span><i><b
            id="progress-bar"></b></i></div>
    </section>
    <div class="profile-heading"><span class="eyebrow">ARCHIVE COLLECTION</span>
      <p>按年代浏览器物档案 · 已解锁器物可查看完整文化信息</p>
    </div>
    <div id="era-sections"></div>
    <section class="era-section easter-egg-section">
      <div class="era-label"><span>彩蛋</span><h2>隐藏成就</h2><i id="easter-egg-count">0 / 9 已解锁</i></div>
      <div class="artifact-rail" id="easter-egg-grid"></div>
    </section>
  </main>

  <div class="profile-modal-backdrop" id="profile-modal-backdrop" hidden>
    <article class="profile-detail" role="dialog" aria-modal="true">
      <button class="modal-close" id="profile-modal-close" type="button" aria-label="关闭详情">×</button>
      <img id="profile-detail-image" src="" alt="">
      <div class="profile-detail-content">
        <span class="eyebrow">ARCHIVE UNLOCKED</span>
        <h2 id="profile-detail-title"></h2>
        <p class="modal-meta" id="profile-detail-meta"></p>
        <div class="modal-rule"></div>
        <p id="profile-detail-description"></p>
        <div class="modal-tags" id="profile-detail-tags"></div>
      </div>
    </article>
  </div>
  <div class="modal-backdrop easter-egg-backdrop" id="easter-egg-backdrop" hidden></div>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/profile.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/audio.js"></script>
</body>

</html>
